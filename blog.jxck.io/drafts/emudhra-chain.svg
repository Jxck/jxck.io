<svg width="1140" height="900" viewBox="0 0 1140 900" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" fill="#222">
  <title>eMudhra 中間 CA 侵害: 証明書チェーンと各社の対応 (2026-10-24 現在)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fbf"/>
    </marker>
  </defs>
  <rect width="1140" height="900" fill="#fff"/>

  <!-- title -->
  <text x="40" y="36" font-size="20" font-weight="bold">eMudhra 中間 CA 侵害: 証明書チェーンと各社の対応</text>
  <text x="1100" y="36" font-size="13" fill="#666" text-anchor="end">2026-10-24 現在</text>

  <!-- row 1: emSign ECC Root CA - G3 -->
  <text x="90" y="92" font-size="13" fill="#666">収録: Apple / Chrome / Microsoft / Mozilla</text>
  <rect x="90" y="100" width="300" height="60" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="125" font-size="16" font-weight="bold">emSign ECC Root CA - G3</text>
  <text x="110" y="147" font-size="13" fill="#555">(eMudhra Technologies Limited)</text>
  <text x="500" y="112" font-size="13" fill="#1f5fbf">Mozilla: NSS 3.131.1 で除去 (10/20)</text>
  <text x="500" y="132" font-size="13" fill="#1f5fbf">Chrome: Root Store から除去 (10/27 予定)</text>
  <text x="500" y="152" font-size="13" fill="#1f5fbf">Apple: ブロック開始 (10/23)</text>

  <!-- arrow: ECC G3 -> Root TLS CA G3 -->
  <line x1="140" y1="160" x2="140" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="210" font-size="13">クロス署名</text>

  <!-- row 2 left: emSign Root TLS CA - G3 -->
  <text x="90" y="262" font-size="13" fill="#666">収録: Microsoft のみ</text>
  <rect x="90" y="270" width="300" height="60" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="295" font-size="16" font-weight="bold">emSign Root TLS CA - G3</text>
  <text x="110" y="317" font-size="13" fill="#555">(eMudhra Technologies Limited)</text>

  <!-- row 2 right: AAA Certificate Services -->
  <text x="530" y="262" font-size="13" fill="#666">収録: Apple / Microsoft</text>
  <rect x="530" y="270" width="400" height="60" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="550" y="295" font-size="16" font-weight="bold">AAA Certificate Services</text>
  <text x="550" y="317" font-size="13" fill="#555">(Comodo CA Limited / 運用は Sectigo / 2004 年のルート)</text>
  <text x="595" y="352" font-size="13" fill="#1f5fbf">Chrome / Mozilla は 2025-04-15 に TLS 信頼を除外済み</text>
  <text x="595" y="370" font-size="13" fill="#1f5fbf">(ルート鍵の生成から 15 年という寿命ポリシー)</text>

  <!-- arrow: Root TLS CA G3 -> intermediates -->
  <line x1="140" y1="330" x2="140" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="380" font-size="13">発行</text>

  <!-- arrow: AAA -> intermediates -->
  <line x1="580" y1="330" x2="580" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="402" font-size="13">クロス署名 (2025-05)</text>

  <!-- row 3: compromised intermediates -->
  <rect x="90" y="450" width="490" height="200" fill="#fff5f5" stroke="#c0392b" stroke-width="2"/>
  <text x="110" y="478" font-size="15" font-weight="bold">問題の中間 CA (TLS 用 6 つ)</text>
  <g font-size="14">
    <text x="110" y="510">EM DV TLS CA - G3B</text>
    <text x="110" y="534">EM OV TLS CA - G3B</text>
    <text x="110" y="558">EM EV TLS CA - G3B</text>
    <text x="340" y="510">EM DV TLS CA - G3C</text>
    <text x="340" y="534">EM OV TLS CA - G3C</text>
    <text x="340" y="558">EM EV TLS CA - G3C</text>
  </g>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#c0392b">
    <text x="250" y="510">(d=156)</text>
    <text x="250" y="534">(d=155)</text>
    <text x="250" y="558">(d=115)</text>
    <text x="480" y="510">(d=230)</text>
    <text x="480" y="534">(d=4)</text>
    <text x="480" y="558">(d=56)</text>
  </g>
  <text x="110" y="590" font-size="12">鍵生成は 2025-04-30 のセレモニー。このとき弱い鍵が混入し、そのまま公開された</text>
  <text x="110" y="612" font-size="12">eMudhra と Comodo がそれぞれ署名しているので、TLS 証明書は 6x2 = 12 枚</text>
  <text x="110" y="634" font-size="12">いずれも eMudhra と Comodo がそれぞれ失効済み。</text>

  <!-- row 3 side: client-side blocks -->
  <line x1="752" y1="460" x2="752" y2="645" stroke="#1f5fbf" stroke-width="3"/>
  <line x1="752" y1="552" x2="734" y2="552" stroke="#1f5fbf" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g font-size="13" fill="#1f5fbf">
    <text x="766" y="478" font-size="14" font-weight="bold">ブロック (クライアント側)</text>
    <text x="766" y="504">Chrome: CRLSet で SPKI をブロック</text>
    <text x="766" y="522">(10/17 19:45 UTC)</text>
    <text x="766" y="546">Firefox: OneCRL でブロック</text>
    <text x="766" y="564">(10/17 22:59 UTC、標準設定に配信完了)</text>
    <text x="766" y="588">Apple: 12 枚のブロックを開始 (10/19)</text>
    <text x="766" y="612">Microsoft: ブロック (10/20)</text>
    <text x="766" y="636">CT Log: この CA 配下を受付拒否に変更</text>
  </g>

  <!-- arrow: intermediates -> leaf -->
  <line x1="410" y1="650" x2="410" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row 4: leaf -->
  <rect x="215" y="720" width="390" height="50" fill="#fff" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="235" y="741" font-size="14" font-weight="bold" fill="#555">サーバ証明書: 発行なし</text>
  <text x="235" y="760" font-size="12" fill="#666">(eMudhra の説明。ブロック前の CT Log にも記録なし)</text>

  <!-- footnotes -->
  <g font-size="12" fill="#666">
    <text x="40" y="812">※ コード署名用の中間 CA 2 つ (EM OV CS CA - G3B d=66 / G3C d=237) は emSign Root CS CA - G3 (Microsoft のみ収録) が発行し、同じく AAA からクロス署名</text>
    <text x="40" y="834">※ Mozilla は emSign Root CA - C1 / emSign ECC Root CA - C3 も同時に除去したが、これは eMudhra の依頼による別件 (Bug 2083709)。emSign Root CA - G1 は Chrome / Mozilla に残存</text>
    <text x="40" y="856">※ Debian は ECC G3 と AAA の 2 ルートを除去 (10/20)。Microsoft の 10/20 はインシデントサイトの時系列によるもので、Microsoft 自身の告知は未確認</text>
    <text x="40" y="878">※ ECC G3 → Root TLS CA - G3 / Root CS CA - G3 のクロス証明書は 2024-07-11 発行 (crt.sh id 14658191778 / 14658191774)。年を省略した日付は 2026 年</text>
  </g>
</svg>
